server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdianping?useSSL=false&serverTimezone=UTC
    username: admin
    password:
  redis:
    host: 127.0.0.1
    port: 6380 # Docker 里的 redis:7（容器名 hmdp-redis7）；本机原 6379 是 Redis 3.0.504，不支持 GEO/BITFIELD/Stream
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
sensenova:
  api-base-url: ${SENSENOVA_API_BASE_URL:https://token.sensenova.cn/v1}
  api-key: ${SENSENOVA_API_KEY:}
  max-retries: 3
  base-backoff-millis: 500
